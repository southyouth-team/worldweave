name: Frontend CI

on:
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main, mvp]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Run unit tests
        if: always() && steps.install.outcome == 'success'
        run: npm test
      - name: Build frontend
        if: always() && steps.install.outcome == 'success'
        run: npm run build
