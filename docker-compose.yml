services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: worldweave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldweave}
      POSTGRES_DB: worldweave
    volumes:
      - worldweave-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldweave -d worldweave"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      # 演示环境用 development 以便自动执行 migration 并创建初始管理员；
      # 生产环境请改为 production，并显式执行迁移、设置强密码。
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: worldweave
      DB_PASSWORD: ${POSTGRES_PASSWORD:-worldweave}
      DB_NAME: worldweave
      DB_SSL: "false"
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      AUTH_ALLOW_DEV_HEADER: "false"
      ASSET_STORAGE_DIR: /data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    volumes:
      - worldweave-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/published-homepage"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api/v1}
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  worldweave-db:
  worldweave-uploads:
